<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>ZScanner · Escáner de documentos en el navegador</title>
<meta name="description" content="Escáner de documentos en el navegador: detección automática con OpenCV.js, ajuste manual de esquinas y corrección de perspectiva. Sin backend.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0f0a">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ZScanner">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="loading-overlay">
  <div class="spinner"></div>
  <div id="loading-text">Cargando el motor de visión…</div>
</div>

<div class="app">
  <header>
    <div class="brand">
      <span class="brand-dot"></span>
      <h1>ZScanner</h1>
    </div>
    <span id="status-pill">iniciando</span>
  </header>

  <div id="stage-live" class="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay" class="layer"></canvas>
    <div class="corner-hint"><span class="tl"></span><span class="tr"></span><span class="bl"></span><span class="br"></span></div>
    <div class="sweep"></div>
  </div>

  <div id="stage-adjust" class="stage hidden">
    <canvas id="adjust-canvas" class="layer"></canvas>
    <canvas id="adjust-overlay" class="layer"></canvas>
  </div>

  <div class="hint-text" id="hint-text">Apunta a un documento sobre una superficie con contraste.</div>
  <div class="hint-text" id="adjust-hint" style="display:none;">Arrastra las esquinas para ajustar el recorte.</div>

  <div class="controls" id="live-controls">
    <button class="icon-btn" id="switch-cam" title="Cambiar cámara">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"></polyline>
        <polyline points="1 20 1 14 7 14"></polyline>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
      </svg>
    </button>
    <button id="shutter" title="Capturar"></button>
    <button class="icon-btn" id="manual-capture" title="Ajustar esquinas manualmente">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 2v14a2 2 0 0 0 2 2h14"></path>
        <path d="M18 22V8a2 2 0 0 0-2-2H2"></path>
      </svg>
    </button>
  </div>

  <div class="controls" id="adjust-controls" style="display:none;">
    <button class="icon-btn" id="adjust-cancel" title="Cancelar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
    <button id="adjust-confirm" title="Usar este recorte">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </button>
  </div>

  <div class="result-panel" id="result-panel">
    <div class="mode-toggle">
      <button data-mode="bw" class="active">Blanco y negro</button>
      <button data-mode="gray">Escala de grises</button>
      <button data-mode="color">Color</button>
    </div>
    <div id="result-canvas-wrap">
      <canvas id="result-canvas"></canvas>
    </div>
    <div class="result-actions">
      <button id="retake-btn">Repetir</button>
      <button id="adjust-again-btn">Ajustar</button>
      <button id="download-btn">Descargar PNG</button>
    </div>
  </div>
</div>

<div id="update-banner" class="update-banner" hidden role="status" aria-live="polite">
  <span>Hay una versión nueva de ZScanner disponible.</span>
  <button id="update-reload-btn" type="button">Recargar</button>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
