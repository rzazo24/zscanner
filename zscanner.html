<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Escáner de documentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0d10;
    --panel: #12161b;
    --panel-edge: #1e242b;
    --text: #e9edf1;
    --muted: #7c8794;
    --amber: #ffb020;
    --amber-dim: #7a5518;
    --green: #3ddc84;
    --danger: #ff5a5a;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
    overflow-x: hidden;
  }
  .app {
    max-width: 520px;
    margin: 0 auto;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 20px 16px 28px;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  header h1 {
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    margin: 0;
  }
  #status-pill {
    font-size: 0.72rem;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--panel-edge);
    color: var(--muted);
    transition: color .25s, border-color .25s;
  }
  #status-pill.locked { color: var(--green); border-color: var(--green); }
  #status-pill.searching { color: var(--amber); border-color: var(--amber-dim); }

  .stage {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 4;
    background: #000;
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--panel-edge);
  }
  video, canvas.layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  video { transform: scaleX(1); }
  #overlay { pointer-events: none; }

  .corner-hint {
    position: absolute;
    inset: 10%;
    border-radius: 6px;
    pointer-events: none;
    opacity: 0.35;
  }
  .corner-hint span {
    position: absolute;
    width: 22px; height: 22px;
    border-color: var(--muted);
    border-style: solid;
    border-width: 0;
  }
  .corner-hint .tl { top:0; left:0; border-top-width:2px; border-left-width:2px; }
  .corner-hint .tr { top:0; right:0; border-top-width:2px; border-right-width:2px; }
  .corner-hint .bl { bottom:0; left:0; border-bottom-width:2px; border-left-width:2px; }
  .corner-hint .br { bottom:0; right:0; border-bottom-width:2px; border-right-width:2px; }

  .sweep {
    position: absolute;
    left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--amber), transparent);
    top: 0;
    opacity: 0;
    animation: sweep 2.6s ease-in-out infinite;
  }
  #stage-live.searching .sweep { opacity: 0.8; }
  @keyframes sweep {
    0% { top: 6%; opacity: 0; }
    15% { opacity: .8; }
    50% { top: 94%; opacity: .8; }
    65% { opacity: 0; }
    100% { top: 6%; opacity: 0; }
  }

  .controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;
    margin-top: 18px;
  }
  button {
    font-family: inherit;
    border: none;
    cursor: pointer;
    color: var(--text);
    transition: transform .12s ease, opacity .12s ease;
  }
  button:active { transform: scale(0.96); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }

  #shutter {
    width: 68px; height: 68px;
    border-radius: 50%;
    background: var(--text);
    border: 4px solid var(--panel-edge);
    position: relative;
  }
  #shutter::after{
    content: "";
    position: absolute; inset: 6px;
    border-radius: 50%;
    background: var(--bg);
    transition: background .15s;
  }
  #shutter.ready::after { background: var(--amber); }

  #adjust-confirm {
    width: 68px; height: 68px;
    border-radius: 50%;
    background: var(--green);
    border: 4px solid var(--panel-edge);
    font-size: 1.4rem;
    font-weight: 700;
    color: #05170d;
  }
  #adjust-overlay { touch-action: none; cursor: grab; }

  .icon-btn {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem;
  }

  .hint-text {
    text-align: center;
    color: var(--muted);
    font-size: 0.82rem;
    margin-top: 12px;
    min-height: 1.2em;
  }

  /* Result view */
  .result-panel {
    display: none;
    flex-direction: column;
    gap: 14px;
  }
  .result-panel.visible { display: flex; }
  #stage-live.hidden, #stage-adjust.hidden { display: none; }

  #result-canvas-wrap {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: var(--radius);
    padding: 10px;
    display: flex;
    justify-content: center;
  }
  #result-canvas-wrap canvas {
    max-width: 100%;
    max-height: 60dvh;
    border-radius: 4px;
  }

  .mode-toggle {
    display: flex;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 999px;
    padding: 3px;
    gap: 3px;
  }
  .mode-toggle button {
    flex: 1;
    background: transparent;
    padding: 8px 0;
    border-radius: 999px;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .mode-toggle button.active {
    background: var(--amber-dim);
    color: var(--amber);
  }

  .result-actions {
    display: flex;
    gap: 8px;
  }
  .result-actions button {
    flex: 1;
    padding: 13px 0;
    border-radius: 10px;
    font-size: 0.8rem;
    font-weight: 600;
  }
  #retake-btn, #adjust-again-btn { background: var(--panel); border: 1px solid var(--panel-edge); color: var(--text); }
  #download-btn { background: var(--amber); color: #1a1200; }

  #loading-overlay {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px;
    font-size: 0.85rem;
    color: var(--muted);
    z-index: 20;
  }
  #loading-overlay.hidden { display: none; }
  .spinner {
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 2px solid var(--panel-edge);
    border-top-color: var(--amber);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="loading-overlay">
  <div class="spinner"></div>
  <div id="loading-text">Cargando el motor de visión…</div>
</div>

<div class="app">
  <header>
    <h1>Escáner</h1>
    <span id="status-pill">iniciando</span>
  </header>

  <div id="stage-live" class="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay" class="layer"></canvas>
    <div class="corner-hint"><span class="tl"></span><span class="tr"></span><span class="bl"></span><span class="br"></span></div>
    <div class="sweep"></div>
  </div>

  <div id="stage-adjust" class="stage hidden">
    <canvas id="adjust-canvas" class="layer"></canvas>
    <canvas id="adjust-overlay" class="layer"></canvas>
  </div>

  <div class="hint-text" id="hint-text">Apunta a un documento sobre una superficie con contraste.</div>
  <div class="hint-text" id="adjust-hint" style="display:none;">Arrastra las esquinas para ajustar el recorte.</div>

  <div class="controls" id="live-controls">
    <button class="icon-btn" id="switch-cam" title="Cambiar cámara">⟲</button>
    <button id="shutter" title="Capturar"></button>
    <button class="icon-btn" id="manual-capture" title="Ajustar esquinas manualmente">▭</button>
  </div>

  <div class="controls" id="adjust-controls" style="display:none;">
    <button class="icon-btn" id="adjust-cancel" title="Cancelar">✕</button>
    <button id="adjust-confirm" title="Usar este recorte">✓</button>
  </div>

  <div class="result-panel" id="result-panel">
    <div class="mode-toggle">
      <button data-mode="bw" class="active">Blanco y negro</button>
      <button data-mode="gray">Escala de grises</button>
      <button data-mode="color">Color</button>
    </div>
    <div id="result-canvas-wrap">
      <canvas id="result-canvas"></canvas>
    </div>
    <div class="result-actions">
      <button id="retake-btn">Repetir</button>
      <button id="adjust-again-btn">Ajustar</button>
      <button id="download-btn">Descargar PNG</button>
    </div>
  </div>
</div>

<script>
const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const stageLive = document.getElementById('stage-live');
const statusPill = document.getElementById('status-pill');
const hintText = document.getElementById('hint-text');
const shutterBtn = document.getElementById('shutter');
const manualBtn = document.getElementById('manual-capture');
const switchCamBtn = document.getElementById('switch-cam');
const liveControls = document.getElementById('live-controls');
const resultPanel = document.getElementById('result-panel');
const resultCanvas = document.getElementById('result-canvas');
const retakeBtn = document.getElementById('retake-btn');
const adjustAgainBtn = document.getElementById('adjust-again-btn');
const downloadBtn = document.getElementById('download-btn');
const loadingOverlay = document.getElementById('loading-overlay');
const loadingText = document.getElementById('loading-text');
const stageAdjust = document.getElementById('stage-adjust');
const adjustCanvas = document.getElementById('adjust-canvas');
const adjustOverlay = document.getElementById('adjust-overlay');
const adjustHint = document.getElementById('adjust-hint');
const adjustControls = document.getElementById('adjust-controls');
const adjustCancelBtn = document.getElementById('adjust-cancel');
const adjustConfirmBtn = document.getElementById('adjust-confirm');

let cvReady = false;
let currentStream = null;
let facingMode = 'environment';
let lastQuad = null;        // 4 points in DETECTION-canvas coordinates
let detectLoopHandle = null;
let currentMode = 'bw';
let lastWarpedMat = null;   // cv.Mat, RGBA, kept between mode switches
let lastShotCanvas = null;  // frozen full-res frame currently in the adjust/result stage
let adjustQuad = null;      // 4 points in lastShotCanvas pixel coords, order tl,tr,br,bl
let adjustReturnTo = 'live'; // where "cancelar" goes back to: 'live' or 'result'
let draggingCorner = -1;

// Detection runs on a downscaled canvas for speed.
const DET_W = 360;
let detCanvas = document.createElement('canvas');
let detCtx = detCanvas.getContext('2d', { willReadFrequently: true });

// Detection parameters, overridable via URL for quick tuning during
// development, e.g. ?minArea=0.1&cannyLow=40&cannyHigh=120&debug=1
const urlParams = new URLSearchParams(location.search);
function numParam(name, fallback) {
  const v = parseFloat(urlParams.get(name));
  return Number.isFinite(v) ? v : fallback;
}
function oddIntParam(name, fallback) {
  const v = Math.round(parseFloat(urlParams.get(name)));
  if (!Number.isFinite(v) || v < 1) return fallback;
  return v % 2 === 0 ? v + 1 : v; // GaussianBlur kernel size must be odd
}
const DET_PARAMS = {
  minAreaRatio: numParam('minArea', 0.15),
  cannyLow: numParam('cannyLow', 50),
  cannyHigh: numParam('cannyHigh', 150),
  blur: oddIntParam('blur', 5),
  approxEpsilon: numParam('epsilon', 0.02),
};
if (urlParams.has('debug')) buildDebugPanel();

function buildDebugPanel() {
  const panel = document.createElement('div');
  panel.id = 'debug-panel';
  panel.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,.85);' +
    'color:#fff;font:11px monospace;padding:8px 10px;z-index:30;max-height:40vh;overflow:auto;';
  const fields = [
    ['minAreaRatio', 0.02, 0.5, 0.01],
    ['cannyLow', 0, 255, 1],
    ['cannyHigh', 0, 255, 1],
    ['blur', 1, 15, 2],
    ['approxEpsilon', 0.005, 0.08, 0.005],
  ];
  fields.forEach(([key, min, max, step]) => {
    const row = document.createElement('label');
    row.style.cssText = 'display:flex;gap:6px;align-items:center;margin-bottom:4px;';
    const val = document.createElement('span');
    val.textContent = key + ': ' + DET_PARAMS[key];
    val.style.cssText = 'width:170px;flex:none;';
    const input = document.createElement('input');
    input.type = 'range';
    input.min = min; input.max = max; input.step = step;
    input.value = DET_PARAMS[key];
    input.style.flex = '1';
    input.addEventListener('input', () => {
      DET_PARAMS[key] = parseFloat(input.value);
      val.textContent = key + ': ' + DET_PARAMS[key];
    });
    row.appendChild(val); row.appendChild(input);
    panel.appendChild(row);
  });
  document.body.appendChild(panel);
}

function onOpenCvReady() {
  // cv.js defines a global Module that resolves asynchronously.
  if (cv && cv['onRuntimeInitialized']) {
    cv['onRuntimeInitialized'] = startCamera;
  } else {
    startCamera();
  }
}
function onOpenCvError() {
  loadingText.textContent = 'No se pudo cargar OpenCV.js. Comprueba tu conexión y recarga.';
}

// Loaded programmatically (rather than a static <script onload>) so the
// listeners above are always registered before the script can finish —
// with a static tag, a cached opencv.js can fire `load` before the parser
// even reaches the script block that defines onOpenCvReady.
(function loadOpenCv() {
  const s = document.createElement('script');
  s.src = 'https://docs.opencv.org/4.9.0/opencv.js';
  s.onload = onOpenCvReady;
  s.onerror = onOpenCvError;
  document.head.appendChild(s);
})();

async function startCamera() {
  cvReady = true;
  try {
    await openStream(facingMode);
    loadingOverlay.classList.add('hidden');
    statusPill.textContent = 'buscando';
    statusPill.className = 'searching';
    stageLive.classList.add('searching');
    runDetectionLoop();
  } catch (err) {
    loadingText.textContent = 'No se pudo acceder a la cámara: ' + err.message;
  }
}

async function openStream(mode) {
  if (currentStream) {
    currentStream.getTracks().forEach(t => t.stop());
  }
  currentStream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: mode, width: { ideal: 1280 }, height: { ideal: 1706 } },
    audio: false
  });
  video.srcObject = currentStream;
  await new Promise(res => { video.onloadedmetadata = () => { video.play(); res(); }; });
  sizeCanvases();
}

function sizeCanvases() {
  const rect = stageLive.getBoundingClientRect();
  overlay.width = rect.width;
  overlay.height = rect.height;
  const vAspect = video.videoWidth / video.videoHeight;
  const stageAspect = rect.width / rect.height;
  // object-fit: cover mapping from video pixel space to displayed stage space
  let sx, sy, sw, sh;
  if (vAspect > stageAspect) {
    sh = video.videoHeight;
    sw = sh * stageAspect;
    sy = 0;
    sx = (video.videoWidth - sw) / 2;
  } else {
    sw = video.videoWidth;
    sh = sw / stageAspect;
    sx = 0;
    sy = (video.videoHeight - sh) / 2;
  }
  video._crop = { sx, sy, sw, sh };
  detCanvas.width = DET_W;
  detCanvas.height = Math.round(DET_W / stageAspect);
}

switchCamBtn.addEventListener('click', async () => {
  facingMode = facingMode === 'environment' ? 'user' : 'environment';
  try { await openStream(facingMode); } catch (e) { /* ignore */ }
});

function runDetectionLoop() {
  if (detectLoopHandle) cancelAnimationFrame(detectLoopHandle);
  const step = () => {
    if (video.readyState >= 2 && video._crop) {
      detectQuad();
    }
    detectLoopHandle = requestAnimationFrame(step);
  };
  detectLoopHandle = requestAnimationFrame(step);
}

// Draw current cropped video frame into a small canvas, then run the
// edge-detect + contour pipeline to find the best 4-point candidate.
function detectQuad() {
  const c = video._crop;
  detCtx.drawImage(video, c.sx, c.sy, c.sw, c.sh, 0, 0, detCanvas.width, detCanvas.height);

  let src, gray, blurred, edges, dilated, kernel, contours, hierarchy, best = null;
  try {
    src = cv.imread(detCanvas);
    gray = new cv.Mat();
    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
    blurred = new cv.Mat();
    cv.GaussianBlur(gray, blurred, new cv.Size(DET_PARAMS.blur, DET_PARAMS.blur), 0);
    edges = new cv.Mat();
    cv.Canny(blurred, edges, DET_PARAMS.cannyLow, DET_PARAMS.cannyHigh);
    dilated = new cv.Mat();
    kernel = cv.Mat.ones(3, 3, cv.CV_8U);
    cv.dilate(edges, dilated, kernel);

    contours = new cv.MatVector();
    hierarchy = new cv.Mat();
    cv.findContours(dilated, contours, hierarchy, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);

    const imgArea = detCanvas.width * detCanvas.height;
    let bestArea = 0;

    for (let i = 0; i < contours.size(); i++) {
      const cnt = contours.get(i);
      const area = cv.contourArea(cnt);
      if (area > imgArea * DET_PARAMS.minAreaRatio && area > bestArea) {
        const peri = cv.arcLength(cnt, true);
        const approx = new cv.Mat();
        cv.approxPolyDP(cnt, approx, DET_PARAMS.approxEpsilon * peri, true);
        if (approx.rows === 4 && cv.isContourConvex(approx)) {
          bestArea = area;
          if (best) best.delete();
          best = approx;
        } else {
          approx.delete();
        }
      }
      cnt.delete();
    }

    if (best) {
      const pts = [];
      for (let i = 0; i < 4; i++) {
        pts.push({ x: best.intPtr(i, 0)[0], y: best.intPtr(i, 0)[1] });
      }
      lastQuad = orderPoints(pts);
      setLocked(true);
    } else {
      lastQuad = null;
      setLocked(false);
    }
  } catch (e) {
    // Skip a frame silently if OpenCV throws (e.g. transient buffer state).
  } finally {
    // `best` is deleted here (rather than right after reading its points above)
    // so it's also cleaned up if an exception is thrown before that point.
    [src, gray, blurred, edges, dilated, kernel, contours, hierarchy, best].forEach(m => m && m.delete && m.delete());
  }

  drawOverlay();
}

function orderPoints(pts) {
  const sums = pts.map(p => p.x + p.y);
  const diffs = pts.map(p => p.x - p.y);
  const tl = pts[sums.indexOf(Math.min(...sums))];
  const br = pts[sums.indexOf(Math.max(...sums))];
  const tr = pts[diffs.indexOf(Math.max(...diffs))];
  const bl = pts[diffs.indexOf(Math.min(...diffs))];
  return [tl, tr, br, bl];
}

function setLocked(locked) {
  if (locked) {
    statusPill.textContent = 'documento detectado';
    statusPill.className = 'locked';
    stageLive.classList.remove('searching');
    hintText.textContent = 'Mantén el encuadre y pulsa el disparador.';
    shutterBtn.classList.add('ready');
  } else {
    statusPill.textContent = 'buscando';
    statusPill.className = 'searching';
    stageLive.classList.add('searching');
    hintText.textContent = 'Apunta a un documento sobre una superficie con contraste.';
    shutterBtn.classList.remove('ready');
  }
}

function drawOverlay() {
  const ctx = overlay.getContext('2d');
  ctx.clearRect(0, 0, overlay.width, overlay.height);
  if (!lastQuad) return;
  const sx = overlay.width / detCanvas.width;
  const sy = overlay.height / detCanvas.height;
  ctx.beginPath();
  lastQuad.forEach((p, i) => {
    const x = p.x * sx, y = p.y * sy;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.closePath();
  ctx.strokeStyle = '#3ddc84';
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.fillStyle = 'rgba(61, 220, 132, 0.12)';
  ctx.fill();
}

// --- Capture, manual corner adjustment & perspective correction ---
//
// Flow: live camera -> (fast path if a quad is already locked, or the
// adjust stage otherwise) -> perspective warp -> result. The adjust stage
// is also reachable from the result panel ("Ajustar") to fix a bad crop
// without retaking the photo.

shutterBtn.addEventListener('click', () => {
  if (lastQuad) {
    captureDetected();
  } else {
    enterAdjustMode(grabFullFrame(), null, 'live');
  }
});

manualBtn.addEventListener('click', () => {
  const shot = grabFullFrame();
  enterAdjustMode(shot, quadFromDetection(shot), 'live');
});

adjustAgainBtn.addEventListener('click', () => {
  resultPanel.classList.remove('visible');
  enterAdjustMode(lastShotCanvas, adjustQuad, 'result');
});

adjustCancelBtn.addEventListener('click', () => {
  if (adjustReturnTo === 'result') {
    stageAdjust.classList.add('hidden');
    adjustControls.style.display = 'none';
    adjustHint.style.display = 'none';
    resultPanel.classList.add('visible');
  } else {
    showLiveStage();
    runDetectionLoop();
  }
});

adjustConfirmBtn.addEventListener('click', () => {
  finalizeWarp(lastShotCanvas, adjustQuad);
});

// Grab a full-resolution frame from the cropped (cover-mapped) video region.
function grabFullFrame() {
  const c = video._crop;
  const fullW = 1400;
  const fullH = Math.round(fullW * (c.sh / c.sw));
  const shot = document.createElement('canvas');
  shot.width = fullW; shot.height = fullH;
  shot.getContext('2d').drawImage(video, c.sx, c.sy, c.sw, c.sh, 0, 0, fullW, fullH);
  return shot;
}

// Scales the live-detected quad (in small detCanvas coordinates) up to a
// full-resolution shot. Returns null if nothing is currently detected.
function quadFromDetection(shot) {
  if (!lastQuad) return null;
  const scaleX = shot.width / detCanvas.width;
  const scaleY = shot.height / detCanvas.height;
  return lastQuad.map(p => ({ x: p.x * scaleX, y: p.y * scaleY }));
}

function defaultInsetQuad(w, h, margin = 0.03) {
  return [
    { x: w * margin, y: h * margin },
    { x: w * (1 - margin), y: h * margin },
    { x: w * (1 - margin), y: h * (1 - margin) },
    { x: w * margin, y: h * (1 - margin) },
  ];
}

// Fast path: a quad is already locked in, so warp straight to the result
// without the extra confirmation tap.
function captureDetected() {
  const shot = grabFullFrame();
  finalizeWarp(shot, quadFromDetection(shot));
}

// Freezes `shot` on the adjust stage with 4 draggable corner handles,
// seeded from `seedQuad` (or a centered inset rectangle if none is given).
function enterAdjustMode(shot, seedQuad, returnTo) {
  cancelAnimationFrame(detectLoopHandle);
  adjustReturnTo = returnTo;
  lastShotCanvas = shot;
  const w = shot.width, h = shot.height;
  adjustQuad = (seedQuad || defaultInsetQuad(w, h)).map(p => ({ x: p.x, y: p.y }));

  adjustCanvas.width = w; adjustCanvas.height = h;
  adjustOverlay.width = w; adjustOverlay.height = h;
  adjustCanvas.getContext('2d').drawImage(shot, 0, 0);

  showAdjustStage();
  drawAdjustOverlay();
}

function showLiveStage() {
  stageLive.classList.remove('hidden');
  stageAdjust.classList.add('hidden');
  liveControls.style.display = 'flex';
  adjustControls.style.display = 'none';
  hintText.style.display = 'block';
  adjustHint.style.display = 'none';
  resultPanel.classList.remove('visible');
}

function showAdjustStage() {
  stageLive.classList.add('hidden');
  stageAdjust.classList.remove('hidden');
  liveControls.style.display = 'none';
  adjustControls.style.display = 'flex';
  hintText.style.display = 'none';
  adjustHint.style.display = 'block';
  resultPanel.classList.remove('visible');
}

// --- Draggable corner handles ---

const HANDLE_RADIUS_CSS = 16;

function overlayScale() {
  const rect = adjustOverlay.getBoundingClientRect();
  return { x: adjustOverlay.width / rect.width, y: adjustOverlay.height / rect.height, rect };
}

function drawAdjustOverlay() {
  const ctx = adjustOverlay.getContext('2d');
  ctx.clearRect(0, 0, adjustOverlay.width, adjustOverlay.height);
  if (!adjustQuad) return;
  const { x: scaleX } = overlayScale();

  ctx.beginPath();
  adjustQuad.forEach((p, i) => {
    if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
  });
  ctx.closePath();
  ctx.strokeStyle = '#3ddc84';
  ctx.lineWidth = 3 * scaleX;
  ctx.stroke();
  ctx.fillStyle = 'rgba(61, 220, 132, 0.12)';
  ctx.fill();

  const r = HANDLE_RADIUS_CSS * scaleX;
  adjustQuad.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 176, 32, 0.9)';
    ctx.fill();
    ctx.lineWidth = 2 * scaleX;
    ctx.strokeStyle = '#1a1200';
    ctx.stroke();
  });
}

function pointerToCanvasCoords(e) {
  const { x: scaleX, y: scaleY, rect } = overlayScale();
  return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
}

function nearestCornerIndex(pt) {
  const { x: scaleX } = overlayScale();
  const threshold = HANDLE_RADIUS_CSS * 1.8 * scaleX;
  let best = -1, bestDist = Infinity;
  adjustQuad.forEach((p, i) => {
    const d = Math.hypot(p.x - pt.x, p.y - pt.y);
    if (d < threshold && d < bestDist) { bestDist = d; best = i; }
  });
  return best;
}

adjustOverlay.addEventListener('pointerdown', (e) => {
  if (!adjustQuad) return;
  const idx = nearestCornerIndex(pointerToCanvasCoords(e));
  if (idx === -1) return;
  draggingCorner = idx;
  adjustOverlay.setPointerCapture(e.pointerId);
  e.preventDefault();
});

adjustOverlay.addEventListener('pointermove', (e) => {
  if (draggingCorner === -1) return;
  const pt = pointerToCanvasCoords(e);
  adjustQuad[draggingCorner] = {
    x: Math.min(Math.max(pt.x, 0), adjustOverlay.width),
    y: Math.min(Math.max(pt.y, 0), adjustOverlay.height),
  };
  drawAdjustOverlay();
  e.preventDefault();
});

function endDrag(e) {
  if (draggingCorner === -1) return;
  draggingCorner = -1;
  try { adjustOverlay.releasePointerCapture(e.pointerId); } catch (_) { /* already released */ }
}
adjustOverlay.addEventListener('pointerup', endDrag);
adjustOverlay.addEventListener('pointercancel', endDrag);

// --- Perspective warp ---

function finalizeWarp(shot, quad) {
  cancelAnimationFrame(detectLoopHandle);
  lastShotCanvas = shot;
  adjustQuad = quad;

  const widthTop = dist(quad[0], quad[1]);
  const widthBottom = dist(quad[3], quad[2]);
  const heightLeft = dist(quad[0], quad[3]);
  const heightRight = dist(quad[1], quad[2]);
  const outW = Math.round(Math.max(widthTop, widthBottom));
  const outH = Math.round(Math.max(heightLeft, heightRight));

  const srcMat = cv.imread(shot);
  const srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
    quad[0].x, quad[0].y,
    quad[1].x, quad[1].y,
    quad[2].x, quad[2].y,
    quad[3].x, quad[3].y,
  ]);
  const dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
    0, 0, outW, 0, outW, outH, 0, outH
  ]);
  const M = cv.getPerspectiveTransform(srcTri, dstTri);
  const warped = new cv.Mat();
  cv.warpPerspective(srcMat, warped, M, new cv.Size(outW, outH));

  if (lastWarpedMat) lastWarpedMat.delete();
  lastWarpedMat = warped;

  srcMat.delete(); srcTri.delete(); dstTri.delete(); M.delete();

  showResult();
  stageLive.classList.add('hidden');
  stageAdjust.classList.add('hidden');
  liveControls.style.display = 'none';
  adjustControls.style.display = 'none';
  hintText.style.display = 'none';
  adjustHint.style.display = 'none';
  resultPanel.classList.add('visible');
}

function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

function showResult() {
  if (!lastWarpedMat) return;
  let out = new cv.Mat();
  if (currentMode === 'color') {
    lastWarpedMat.copyTo(out);
  } else {
    let gray = new cv.Mat();
    cv.cvtColor(lastWarpedMat, gray, cv.COLOR_RGBA2GRAY);
    if (currentMode === 'gray') {
      cv.cvtColor(gray, out, cv.COLOR_GRAY2RGBA);
    } else {
      let bw = new cv.Mat();
      cv.adaptiveThreshold(gray, bw, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY, 25, 12);
      cv.cvtColor(bw, out, cv.COLOR_GRAY2RGBA);
      bw.delete();
    }
    gray.delete();
  }
  cv.imshow(resultCanvas, out);
  out.delete();
}

document.querySelectorAll('.mode-toggle button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-toggle button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentMode = btn.dataset.mode;
    showResult();
  });
});

retakeBtn.addEventListener('click', () => {
  showLiveStage();
  lastQuad = null;
  setLocked(false);
  runDetectionLoop();
});

downloadBtn.addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = 'documento-escaneado.png';
  link.href = resultCanvas.toDataURL('image/png');
  link.click();
});

window.addEventListener('resize', () => { if (video.videoWidth) sizeCanvases(); });
</script>
